<!doctype html>
<!--
  ويكند سعيد — نسخة الملف الواحد (HTML5)
  يتولّد تلقائياً من مجلد public بالأمر: npm run build:single — لا تعدّله يدوياً.
  - مفتوح من خادم المنصة (server.js) على /weekend-saeed.html: بيانات مشتركة وتحديث مباشر لكل الموظفين.
  - مفتوح بدبل كلك من الجهاز: يشتغل محلياً والبيانات في متصفح هذا الجهاز فقط.
  دخول الإدارة أول مرة: admin / weekend123 (غيّرها من زر كلمة المرور)
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ويكند سعيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<style>
/* هوية الجهة: ترويسة كحلية، شريط ألوان علوي، بطاقات بيضاء بخط لوني جانبي وأرقام كبيرة */
:root {
  --bg: #f2f4f6;
  --card: #ffffff;
  --ink: #17303d;
  --muted: #667784;
  --line: #e1e6ea;
  --head: #114b5f;
  --head-ink: #ffffff;
  --head-soft: #8fd0ea;
  /* ألوان الهوية */
  --c-navy: #154b63;
  --c-teal: #1f8a87;
  --c-blue: #3e95cf;
  --c-green: #6f9a2c;
  --c-orange: #e0823a;
  --c-maroon: #8a2c47;
  /* أسماء مستخدمة في باقي الصفحة */
  --sea: var(--c-navy);
  --sea-soft: #e7f0f3;
  --sun: var(--c-orange);
  --sun-soft: #fcf1e7;
  --gold: #b7862a;
  --like: #c7365a;
  --ok: #3f7d22;
  --bad: #b3261e;
  --shadow: 0 1px 2px rgba(17, 75, 95, .06), 0 4px 14px rgba(17, 75, 95, .06);
  --radius: 10px;
  --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a20; --card: #172630; --ink: #e8eff3; --muted: #9fb1bc; --line: #26394a;
    --head: #0c3a4a; --sea: #6fb7d6; --sea-soft: #173544; --sun-soft: #3a2a1c;
    --c-navy: #6fb7d6; --c-teal: #4fc0bb; --c-blue: #6db3e3; --c-green: #9cc45a; --c-orange: #f0a062; --c-maroon: #d7718e;
    --shadow: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a20; --card: #172630; --ink: #e8eff3; --muted: #9fb1bc; --line: #26394a;
  --head: #0c3a4a; --sea: #6fb7d6; --sea-soft: #173544; --sun-soft: #3a2a1c;
  --c-navy: #6fb7d6; --c-teal: #4fc0bb; --c-blue: #6db3e3; --c-green: #9cc45a; --c-orange: #f0a062; --c-maroon: #d7718e;
  --shadow: 0 4px 14px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.75; }
img { max-width: 100%; display: block; }
a { color: var(--sea); }
h1, h2, h3, h4 { line-height: 1.4; margin: 0; text-wrap: balance; }
p { margin: .3em 0; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: 16px; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--c-blue); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

/* ---------- شريط الألوان العلوي ---------- */
.stripe { display: flex; height: 5px; }
.stripe i { flex: 1; }
.stripe i:nth-child(1) { background: #e0823a; }
.stripe i:nth-child(2) { background: #8a2c47; }
.stripe i:nth-child(3) { background: #1f8a87; }
.stripe i:nth-child(4) { background: #3e95cf; }
.stripe i:nth-child(5) { background: #6f9a2c; }
.stripe i:nth-child(6) { background: #154b63; }

/* ---------- الترويسة ---------- */
.hero { background: var(--head); color: var(--head-ink); padding-block: 18px 30px; }
.hero-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo-plate { background: #fff; border-radius: 8px; padding: 4px 10px; display: inline-flex; }
.logo-plate img { height: 96px; width: auto; }
@media (max-width: 560px) { .logo-plate img { height: 70px; } }
.brand b { display: block; font-size: 1rem; font-weight: 700; }
.brand span { display: block; font-size: .68rem; letter-spacing: .06em; opacity: .85; direction: ltr; text-align: right; }
.userbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: .9rem; }
.userbar a, .userbar .link-btn { color: var(--head-ink); opacity: .85; text-decoration: none; }
.userbar a:hover, .userbar .link-btn:hover { opacity: 1; text-decoration: underline; }

.hero-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px 32px; flex-wrap: wrap; margin-top: 26px; }
.hero-text { flex: 1 1 420px; min-width: 0; }
.eyebrow { color: var(--head-soft); font-size: .88rem; font-weight: 600; margin: 0; }
.hero h1 { font-size: clamp(1.9rem, 4.5vw, 2.6rem); font-weight: 700; margin: 4px 0 8px; }
.hero h1::after { content: ' ☀️'; }
.greeting { font-size: 1.02rem; max-width: 640px; opacity: .92; margin: 0; }

.info-box { display: flex; margin: 0; border: 1px solid rgba(255, 255, 255, .22); border-radius: 8px; overflow: hidden; }
.info-box > div { padding: 10px 18px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.info-box > div + div { border-inline-start: 1px solid rgba(255, 255, 255, .22); }
.info-box dt { color: var(--head-soft); font-size: .75rem; font-weight: 600; }
.info-box dd { margin: 0; font-weight: 700; font-size: .98rem; white-space: nowrap; }
.info-box span { font-size: .75rem; opacity: .8; white-space: nowrap; }
@media (max-width: 560px) { .info-box { width: 100%; } .info-box > div { flex: 1; padding: 8px 10px; } .info-box dd { white-space: normal; } }

/* ---------- بطاقات الأرقام (الطقس والعدّاد) ---------- */
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin-top: -1px; padding-top: 18px; }
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  border-inline-start: 4px solid var(--acc); padding: 14px 18px; display: grid; gap: 2px; align-content: start; min-width: 0;
}
.stat.c1 { --acc: var(--c-navy); } .stat.c2 { --acc: var(--c-blue); } .stat.c3 { --acc: var(--c-green); } .stat.c4 { --acc: var(--c-orange); }
.stat-num { font-size: 2.1rem; font-weight: 700; line-height: 1.2; color: var(--acc); font-variant-numeric: tabular-nums; }
.stat-label { font-weight: 700; font-size: .95rem; }
.stat small { color: var(--muted); font-size: .8rem; }
@media (max-width: 560px) {
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 10px 12px; }
  .stat-num { font-size: 1.6rem; }
  .stat-label { font-size: .85rem; }
}

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.chips a {
  color: var(--ink); text-decoration: none; background: var(--card); border: 1px solid var(--line);
  padding: 5px 14px; border-radius: 6px; font-size: .9rem; transition: border-color .2s, color .2s;
}
.chips a:hover { border-color: var(--c-teal); color: var(--c-teal); }

/* ---------- الأقسام ---------- */
main section { padding: 30px 0 4px; scroll-margin-top: 10px; --acc: var(--c-navy); }
main section[data-acc="0"] { --acc: var(--c-navy); }
main section[data-acc="1"] { --acc: var(--c-teal); }
main section[data-acc="2"] { --acc: var(--c-blue); }
main section[data-acc="3"] { --acc: var(--c-green); }
main section[data-acc="4"] { --acc: var(--c-orange); }
main section[data-acc="5"] { --acc: var(--c-maroon); }
.sec-head { margin-bottom: 14px; padding-inline-start: 12px; border-inline-start: 4px solid var(--acc); }
.sec-head h2 { font-size: 1.35rem; font-weight: 700; color: var(--ink); }
.sec-head p { color: var(--muted); font-size: .92rem; margin: 0; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.match, .rec, .creative-item, .selfdev, .poll, .quiz, .occasion, .featured, .shot { border-inline-start: 4px solid var(--acc); }
.grid > *, .stack > * { min-width: 0; }

/* ---------- تخطيط الصفحة بدون فراغات ----------
   الأقسام تصطف جنب بعض حسب عرضها (ربع/ثلث/نص/كامل) وتتمدد لين تعبّي الصف.
   والمشاركات داخل القسم كذلك: كل وحدة لها حجم أساسي، وتتمدد عشان ما يبقى فراغ في آخر الصف. */
main.wrap { display: flex; flex-wrap: wrap; align-items: stretch; column-gap: 20px; }
main > section { flex: 1 1 100%; min-width: 0; display: flex; flex-direction: column; }
main > section[data-width="quarter"] { flex-basis: max(250px, calc(25% - 15px)); }
main > section[data-width="third"] { flex-basis: max(280px, calc(33.333% - 14px)); }
main > section[data-width="half"] { flex-basis: max(320px, calc(50% - 10px)); }
main > section > .grid, main > section > .single, main > section > .stack { flex: 1 1 auto; }

.grid { display: flex; flex-wrap: wrap; gap: 14px; align-content: stretch; }
.grid > * { flex: 1 1 max(240px, calc(33.333% - 10px)); }
section[data-size="sm"] .grid > * { flex-basis: max(190px, calc(25% - 11px)); }
section[data-size="md"] .grid > * { flex-basis: max(240px, calc(33.333% - 10px)); }
section[data-size="lg"] .grid > * { flex-basis: max(280px, calc(50% - 7px)); }
section[data-size="full"] .grid > * { flex-basis: 100%; }
/* حجم المشاركة نفسها يغلب حجم القسم */
.grid > .sz-sm.sz-sm { flex-basis: max(190px, calc(25% - 11px)); }
.grid > .sz-md.sz-md { flex-basis: max(240px, calc(33.333% - 10px)); }
.grid > .sz-lg.sz-lg { flex-basis: max(280px, calc(50% - 7px)); }
.grid > .sz-full.sz-full { flex-basis: 100%; }
.grid > .empty.empty { flex-basis: 100%; }
@media (max-width: 760px) {
  main > section[data-width] { flex-basis: 100%; }
}
@media (max-width: 560px) {
  .grid > *, .grid > [class*="sz-"][class*="sz-"] { flex-basis: 100% !important; }
}

/* ---------- المرفقات ---------- */
.att { display: grid; gap: 8px; }
.att-img { display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.att-img img { width: 100%; max-height: 320px; object-fit: cover; }
.att-file {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap; text-decoration: none; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: .92rem;
  overflow-wrap: anywhere;
}
.att-file small { color: var(--muted); font-weight: 400; margin-inline-start: auto; }
.att-file:hover { border-color: var(--acc, var(--c-teal)); }
.sec-extra { display: grid; gap: 10px; margin-bottom: 12px; }
.sec-extra:empty { display: none; }
.sec-extra .att-img img { max-height: 380px; }

/* ---------- وضع تنسيق الصفحة (للإدارة) ---------- */
.lay-tools { display: none; }
.layout-mode .lay-tools {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted);
  background: var(--sea-soft); border: 1px dashed var(--c-blue); border-radius: 6px; padding: 4px 6px;
}
.layout-mode .lay-tools button {
  font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 4px; padding: 0 8px; cursor: pointer;
}
.layout-mode .lay-tools button.on { background: var(--head); color: #fff; border-color: var(--head); }
.layout-mode main > section { outline: 1px dashed var(--c-blue); outline-offset: 6px; border-radius: 4px; }
.layout-mode .grid > * { outline: 1px dashed rgba(62, 149, 207, .5); }
.stack { display: grid; gap: 14px; }
.empty { text-align: center; color: var(--muted); padding: 34px 16px; margin: 0; }

.tag { display: inline-block; font-size: .75rem; font-weight: 600; background: var(--sea-soft); color: var(--acc, var(--sea)); padding: 0 10px; border-radius: 4px; }
.tag.gold { background: var(--sun-soft); color: var(--gold); }

/* المناسبات */
.occasion {
  display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1px solid var(--line);
  border-inline-start: 4px solid var(--acc); border-radius: var(--radius); padding: 10px 16px; box-shadow: var(--shadow);
}
.oc-row { display: flex; gap: 10px; align-items: center; }
.oc-ic { font-size: 1.7rem; }
.occasion p { margin: 0; font-size: .9rem; }

/* المباريات */
.match { display: flex; flex-direction: column; gap: 10px; }
.match-top { display: flex; justify-content: space-between; gap: 8px; font-size: .82rem; flex-wrap: wrap; }
.league { font-weight: 700; color: var(--acc); }
.day { color: var(--muted); }
.teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; font-weight: 700; font-size: 1.1rem; }
.vs { background: var(--sea-soft); color: var(--muted); border-radius: 4px; padding: 0 8px; font-size: .75rem; }
.match-meta { font-size: .82rem; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }

/* الاستطلاع */
.poll h3 { font-size: 1.15rem; margin-bottom: 14px; }
.poll-opts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.poll-opt {
  position: relative; overflow: hidden; display: flex; justify-content: space-between; align-items: center;
  gap: 8px; padding: 12px 16px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; transition: border-color .2s;
}
.poll-opt:hover:not(:disabled), .poll-opt.mine { border-color: var(--acc); }
.poll-opt:disabled { cursor: default; }
.poll-opt .bar { position: absolute; inset: 0 0 0 auto; background: var(--sea-soft); transition: width .6s ease; z-index: 0; }
.poll-opt span:not(.bar) { position: relative; z-index: 1; }
.opt-pct { color: var(--acc); }
.opt-pct small { color: var(--muted); font-weight: 400; }

/* التوصيات والإبداع */
.rec, .creative-item { display: flex; flex-direction: column; gap: 8px; }
.rec-head { display: flex; gap: 12px; align-items: flex-start; }
.rec-ic { font-size: 1.7rem; line-height: 1; background: var(--sea-soft); border-radius: 8px; padding: 10px; }
.rec h3, .creative-item h3 { font-size: 1rem; margin-top: 4px; font-weight: 700; }
.rec h4 { font-size: 1.15rem; color: var(--acc); }
.who { color: var(--c-orange); }
.rec-link { display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap; }
.qr { background: #fff; padding: 6px; border-radius: 6px; line-height: 0; border: 1px solid var(--line); }
.qr:empty { display: none; }
.qr svg { width: 96px; height: 96px; }

/* عدسة الموظف */
.featured { padding: 0; overflow: hidden; }
.featured img { width: 100%; max-height: 540px; object-fit: cover; }
.featured figcaption, .featured .interact { padding: 12px 18px; }
.featured .interact { padding-top: 0; }
figure { margin: 0; }
.gallery { margin: 14px 0; }
.gallery:empty { display: none; }
.shot { padding: 0; overflow: hidden; }
.shot img { aspect-ratio: 4 / 3; object-fit: cover; width: 100%; }
.shot figcaption, .shot .interact { padding: 8px 12px; font-size: .88rem; }
.form-card { margin-top: 14px; }
.form-card summary { cursor: pointer; font-weight: 700; color: var(--acc); }
.form-card[open] summary { margin-bottom: 12px; }

.body { white-space: pre-line; overflow-wrap: anywhere; }
.body.poem { text-align: center; font-size: 1.1rem; line-height: 2.1; background: var(--sea-soft); border-radius: 8px; padding: 18px; }
.body.clamp { max-height: 9.5em; overflow: hidden; mask-image: linear-gradient(#000 70%, transparent); }
.expanded .body.clamp { max-height: none; mask-image: none; }
.link-btn { background: none; border: 0; color: var(--sea); font: inherit; cursor: pointer; padding: 0; align-self: flex-start; }

.selfdev { display: flex; flex-direction: column; gap: 6px; }
.selfdev h3 { font-size: 1.05rem; }

/* المسابقة */
.quiz-q { display: flex; gap: 18px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.quiz-q > div:first-child { flex: 1 1 300px; min-width: 0; }
.quiz-q h3 { font-size: 1.2rem; margin: 4px 0 8px; }
.quiz-label { color: var(--acc); font-weight: 700; font-size: .85rem; }
.quiz-qr { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.winner { margin-top: 14px; background: var(--sun-soft); padding: 12px 16px; border-radius: 8px; }
.winner.soft { background: var(--sea-soft); }

/* النماذج */
.form { display: grid; gap: 12px; }
.form label { display: grid; gap: 4px; font-weight: 500; font-size: .92rem; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.row-form { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 14px; }
input, textarea, select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 12px; width: 100%;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--c-blue); box-shadow: 0 0 0 3px rgba(62, 149, 207, .15); }
.form-msg { margin: 0; color: var(--ok); font-weight: 500; }
.form-msg.bad { color: var(--bad); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 600;
  background: var(--head); color: #fff; border: 0; border-radius: 6px; padding: 9px 20px; cursor: pointer;
  text-decoration: none; transition: filter .2s;
}
.btn:hover { filter: brightness(1.12); }
.btn:disabled { opacity: .6; cursor: wait; }
.btn.sm { padding: 5px 14px; font-size: .88rem; align-self: flex-start; }
.btn.ghost { background: transparent; color: var(--sea); border: 1px solid currentColor; }
.btn.danger { background: var(--bad); }
.btn.sun { background: var(--c-orange); }

/* التفاعل */
.interact { margin-top: auto; padding-top: 8px; border-top: 1px dashed var(--line); }
.interact-bar { display: flex; gap: 8px; flex-wrap: wrap; }
.pill {
  font: inherit; font-size: .85rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 2px 12px; cursor: pointer; text-decoration: none;
}
.pill:hover { border-color: var(--c-teal); }
.pill.like.on { color: var(--like); border-color: var(--like); }
.comments { margin-top: 10px; display: grid; gap: 8px; }
.comment { background: var(--bg); border-radius: 6px; padding: 8px 12px; font-size: .9rem; }
.comment p { margin: 2px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
.comment .link-btn { color: var(--muted); margin-inline-start: 6px; }
.comment-form { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.comment-form input { padding: 6px 10px; font-size: .9rem; }

/* الفوتر */
.footer { margin-top: 44px; padding-block: 28px; background: var(--head); color: var(--head-ink); text-align: center; }
.footer .muted { color: var(--head-soft); }
.quote { font-size: 1.15rem; font-weight: 600; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 10px 20px; border-radius: 8px; box-shadow: var(--shadow); z-index: 50; max-width: calc(100% - 32px);
}
.toast.bad { background: var(--bad); color: #fff; }
body.loading main, body.loading .chips, body.loading .stats { visibility: hidden; }

/* ---------- الدخول ---------- */
.login-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--head); }
.login-page main { flex: 1; display: grid; place-items: center; padding: 24px 16px; }
.login-page .login { margin: 0; width: 100%; max-width: 400px; }
.login-head { text-align: center; display: grid; gap: 4px; justify-items: center; }
.login-head img { height: 112px; width: auto; }
.login-head .org { font-size: .85rem; color: var(--muted); }
.login-head h1 { font-size: 1.8rem; font-weight: 700; }
.login { max-width: 380px; margin: 80px auto; }

dialog.card { border: 1px solid var(--line); color: var(--ink); width: min(420px, calc(100% - 32px)); }
dialog::backdrop { background: rgba(0, 0, 0, .4); }

/* ---------- لوحة الإدارة ---------- */
.admin-head { background: var(--head); color: var(--head-ink); padding-block: 14px; margin-bottom: 18px; }
.admin-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.admin-bar h2 { font-size: 1.25rem; font-weight: 700; }
.admin-bar .btn.ghost { color: var(--head-ink); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.tabs button { font: inherit; font-size: .92rem; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 14px; cursor: pointer; }
.tabs button.on { background: var(--head); color: #fff; border-color: var(--head); }
.tabs button.off { opacity: .55; text-decoration: line-through; }
.item-editor { border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; background: var(--bg); }
.item-editor.hidden-sec { opacity: .6; border-style: dashed; }
.item-editor.dragging { opacity: .4; }
.item-editor.drop-before { box-shadow: 0 -3px 0 var(--c-blue); }
.item-editor .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.drag { cursor: grab; user-select: none; color: var(--muted); font-size: 1.1rem; padding: 0 4px; touch-action: none; }
.editor-list { display: grid; gap: 12px; margin-bottom: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.check { display: flex !important; grid-auto-flow: column; align-items: center; gap: 8px !important; }
.check input { width: auto; }
.state { font-size: .8rem; font-weight: 700; border-radius: 4px; padding: 1px 10px; }
.state.on { background: rgba(63, 125, 34, .12); color: var(--ok); }
.state.off { background: rgba(179, 38, 30, .1); color: var(--bad); }
.vis-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.vis-bar.off { border-color: var(--bad); border-style: dashed; }
.table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.table th, .table td { border-bottom: 1px solid var(--line); padding: 8px; text-align: right; vertical-align: top; }
.table tr.correct td { background: rgba(63, 125, 34, .08); }
.table tr.done td { opacity: .55; }
.admin-photos { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.admin-photos .card { padding: 10px; display: grid; gap: 8px; }
.admin-photos img { border-radius: 6px; aspect-ratio: 4/3; object-fit: cover; width: 100%; }
.sec-row { display: grid; grid-template-columns: 70px 1fr 1fr 1.6fr; gap: 8px; align-items: end; }
@media (max-width: 760px) { .sec-row { grid-template-columns: 1fr 1fr; } }
.logo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.logo-row img { height: 56px; width: auto; background: #fff; border: 1px solid var(--line); padding: 6px; border-radius: 6px; }
.size-pick { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.size-pick select { width: auto; padding: 4px 10px; }
.cred { font-family: Consolas, Menlo, monospace; direction: ltr; unicode-bidi: isolate; }
.notice { background: var(--sea-soft); border-radius: 8px; padding: 10px 14px; }
.email-preview { border: 1px solid var(--line); border-radius: 8px; background: #fff; max-height: 600px; overflow: auto; }
.table-wrap { overflow-x: auto; }
.attach-edit { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-top: 1px dashed var(--line); padding-top: 10px; }
.attach-edit label.pill { display: inline-flex !important; }
.att-chip { display: inline-flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: .88rem; }
.att-chip img { height: 40px; width: auto; border-radius: 4px; }
.sec-title-edit { display: grid; gap: 8px; margin-bottom: 14px; }
.sec-title-edit h3 { font-size: 1.2rem; }
.sec-title-edit label { display: grid; gap: 4px; font-size: .9rem; font-weight: 500; }
.item-editor .hint { display: block; font-weight: 400; }
.empty-cta { text-align: center; display: grid; justify-items: center; gap: 10px; padding: 26px 16px; border: 2px dashed var(--line); border-radius: 8px; margin-bottom: 12px; }
.sec-head { position: relative; }
.edit-sec {
  position: absolute; inset-inline-end: 0; top: 2px; font: inherit; font-size: .82rem; cursor: pointer;
  background: var(--card); color: var(--sea); border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px;
}
.edit-sec:hover { border-color: var(--sea); }
.sec-title-edit > .btn { justify-self: start; }

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';

  // ---------- كلمات المرور (SHA-256 مع ملح) ----------
  async function hashPassword(pw, salt = rid() + rid()) {
    const data = new TextEncoder().encode(salt + ':' + pw);
    let hex;
    if (crypto.subtle) {
      hex = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', data)), (b) => b.toString(16).padStart(2, '0')).join('');
    } else {
      // بعض المتصفحات تمنع التشفير للملفات المحلية: نستخدم بصمة بسيطة بدالها
      let h = 0x811c9dc5;
      for (const b of data) h = Math.imul(h ^ b, 16777619) >>> 0;
      hex = 'f' + h.toString(16);
    }
    return `${salt}:${hex}`;
  }
  async function checkPassword(pw, stored) {
    const [salt] = String(stored || '').split(':');
    return !!salt && (await hashPassword(pw, salt)) === stored;
  }
  function makePassword() {
    const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from(crypto.getRandomValues(new Uint32Array(10)), (n) => c[n % c.length]).join('');
  }

    return {
      issue: {
        number: 1, title: 'ويكند سعيد', greeting: 'هلا والله! هذا أول عدد من نشرتنا، وبنكمّلها سوا كل ويكند 😊',
        dateFrom: '', dateTo: '', quote: '', footer: 'ويكند سعيد — من الفريق، للفريق 💛', siteUrl: '',
        orgName: 'المكتب الاستراتيجي لتطوير منطقة جازان', orgNameEn: 'JAZAN REGION DEVELOPMENT STRATEGIC OFFICE', logo: DEFAULT_LOGO,
      },
      sections: SECTIONS,
      weather: { enabled: true, city: 'جازان', lat: 16.8892, lon: 42.5511 },
      matches: [],
      poll: { id: rid(), question: '', home: '', away: '', allowDraw: true, closed: false, votes: {} },
      recommendations: [], creative: [], selfdev: [], occasions: [],
      quiz: { id: rid(), question: '', hint: '', accepted: [], prize: '', closed: false, winner: null, answers: [] },
      photos: [], featuredPhotoId: null, likes: {}, comments: [], suggestions: [],
      users: [{ id: rid(), name: 'مدير النشرة', email: '', username: 'admin', pass: await hashPassword('weekend123'), isAdmin: true, createdAt: now() }],
    };
  }

  let db = null;
  async function ready() {
    if (db) return;
    try { db = JSON.parse(ls.get(KEY)); } catch { db = null; }
    if (!db) { db = await seed(); persist(); }
    db.sections = normalizeSections(db.sections);
    if (!db.issue.logo && !db.issue.logoRemoved) db.issue.logo = DEFAULT_LOGO;
  }
  function persist() {
    if (!ls.set(KEY, JSON.stringify(db))) throw err(507, 'مساحة التخزين في المتصفح امتلأت، احذف بعض الصور القديمة من لوحة الإدارة');
  }
  const save = persist;

  // ---------- التحديث الحي بين التبويبات ----------
  const listeners = new Set();
  const broadcast = () => setTimeout(() => listeners.forEach((l) => l.onmessage && l.onmessage({ data: 'changed' })), 0);
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY) return;
    try { db = JSON.parse(e.newValue) || db; } catch { /* تجاهل */ }
    broadcast();
  });
  // في وضع الخادم نستخدم التحديث الحي الحقيقي، وفي الوضع المحلي نحاكيه بين تبويبات المتصفح
  const RealEventSource = window.EventSource;
  window.EventSource = function (url, opts) {
    if (MODE === 'server') return new RealEventSource(url, opts);
    const es = { onmessage: null, close() { listeners.delete(es); } };
    listeners.add(es);
    return es;
  };

  // ---------- أدوات ----------
  function err(status, message) { return Object.assign(new Error(message), { status }); }
  const need = (c, msg, status = 400) => { if (!c) throw err(status, msg); };
  const normalizeArabic = (s) => str(s, 200).replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').toLowerCase();
  const EMAIL_RE = /^[^\s@,;<>"']+@[^\s@,;<>"']+\.[^\s@,;<>"']+$/;
  const publicUser = (u) => ({ id: u.id, name: u.name, email: u.email, username: u.username, isAdmin: !!u.isAdmin, createdAt: u.createdAt, lastLogin: u.lastLogin || null });
  const LIST = {
    matches: ['league', 'home', 'away', 'day', 'time', 'channel', 'stadium', 'size'],
    recommendations: ['category', 'title', 'colleague', 'itemName', 'description', 'location', 'link', 'size'],
    creative: ['type', 'title', 'author', 'body', 'link', 'size'],
    selfdev: ['title', 'summary', 'source', 'link', 'readMinutes', 'size'],
    occasions: ['type', 'person', 'text', 'size'],
  };
  const cleanItem = (fields, it) => {
    const o = { id: /^[a-f0-9]{12}$/.test(it.id) ? it.id : rid() };
    for (const f of fields) o[f] = str(it[f], 5000);
    if ('size' in o && !SIZES.includes(o.size)) o.size = '';
    return { ...o, ...cleanAttach(it) };
  };
  function normalizeSections(list) {
    const out = [];
    for (const s of Array.isArray(list) ? list : []) {
      const d = SECTIONS.find((x) => x.key === s?.key);
      if (!d || out.some((x) => x.key === s.key)) continue;
      out.push({ key: s.key, emoji: str(s.emoji, 8), title: str(s.title, 120) || d.title, subtitle: str(s.subtitle, 300), nav: str(s.nav, 40) || d.nav, visible: s.visible !== false, size: SIZES.includes(s.size) ? s.size : d.size, width: WIDTHS.includes(s.width) ? s.width : d.width, ...cleanAttach(s) });
    }
    for (const d of SECTIONS) if (!out.some((x) => x.key === d.key)) out.push({ ...d });
    return out;
  }
  function makeUsername(email) {
    const base = email.split('@')[0].toLowerCase().replace(/[^a-z0-9._-]/g, '') || 'user';
    let u = base;
    for (let n = 2; db.users.some((x) => x.username === u); n++) u = `${base}${n}`;
    return u;
  }
  const nameFromEmail = (e) => e.split('@')[0].split(/[._-]+/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');

  // ---------- الطقس (Open-Meteo مباشرة من المتصفح) ----------
  async function getWeather() {
    const w = db.weather;
    if (!w.enabled) return null;
    const key = `${w.lat},${w.lon}`;
    let cache = null;
    try { cache = JSON.parse(ls.get(WKEY)); } catch { /* تجاهل */ }
    if (cache && cache.key === key && Date.now() - cache.at < 30 * 6e4) return { ...cache.data, city: w.city };
    const q = new URLSearchParams({
      latitude: w.lat, longitude: w.lon, timezone: 'auto', forecast_days: 7,
      current: 'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min',
    });
    try {
      const r = await realFetch(`${WEATHER_API}/v1/forecast?${q}`);
      const j = await r.json();
      const data = {
        city: w.city,
        current: { temp: Math.round(j.current.temperature_2m), feels: Math.round(j.current.apparent_temperature), humidity: j.current.relative_humidity_2m, wind: Math.round(j.current.wind_speed_10m), code: j.current.weather_code },
        days: j.daily.time.map((date, i) => ({ date, code: j.daily.weather_code[i], max: Math.round(j.daily.temperature_2m_max[i]), min: Math.round(j.daily.temperature_2m_min[i]) })),
      };
      ls.set(WKEY, JSON.stringify({ key, at: Date.now(), data }));
      return data;
    } catch {
      return cache && cache.key === key ? cache.data : null; // بدون إنترنت: آخر قراءة أو لا شيء
    }
  }

  function publicState(user) {
    const counts = { home: 0, draw: 0, away: 0 };
    for (const c of Object.values(db.poll.votes)) if (c in counts) counts[c]++;
    const likes = {};
    for (const [t, arr] of Object.entries(db.likes)) likes[t] = { count: arr.length, mine: arr.includes(user.id) };
    const { accepted, answers, ...quiz } = db.quiz;
    return {
      me: { id: user.id, name: user.name, username: user.username, isAdmin: !!user.isAdmin },
      issue: db.issue, sections: db.sections, weatherCity: db.weather.enabled ? db.weather.city : null,
      matches: db.matches, poll: { ...db.poll, votes: undefined, counts, myVote: db.poll.votes[user.id] || null },
      recommendations: db.recommendations, creative: db.creative, selfdev: db.selfdev, occasions: db.occasions,
      quiz: { ...quiz, answersCount: answers.length, answered: answers.some((a) => a.userId === user.id), accepted: quiz.closed ? accepted : undefined },
      photos: db.photos.filter((p) => p.approved || p.id === db.featuredPhotoId).map(({ userId: _, ...p }) => p),
      featuredPhotoId: db.featuredPhotoId, likes,
      comments: db.comments.map(({ userId, ...c }) => ({ ...c, mine: userId === user.id })),
    };
  }

  // ---------- المسارات (نفس منطق server.js) ----------
  async function route(m, p, body) {
    await ready();
    if (m === 'POST' && p === '/api/login') {
      const login = str(body.username, 200).toLowerCase();
      const u = db.users.find((x) => x.username === login || (x.email && x.email.toLowerCase() === login));
      need(u && await checkPassword(String(body.password || ''), u.pass), 'اسم المستخدم أو كلمة المرور غير صحيحة', 401);
      u.lastLogin = now(); save(); ls.set(SKEY, u.id);
      return { ok: true, isAdmin: !!u.isAdmin };
    }
    if (m === 'POST' && p === '/api/logout') { ls.del(SKEY); return { ok: true }; }
    if (m === 'GET' && p === '/api/brand') { const { title, orgName, orgNameEn, logo } = db.issue; return { title, orgName, orgNameEn, logo }; }

    const user = db.users.find((u) => u.id === ls.get(SKEY));
    need(user, 'سجّل دخولك أولاً', 401);

    if (m === 'GET' && p === '/api/state') return publicState(user);
    if (m === 'GET' && p === '/api/weather') return { weather: await getWeather() };

    if (m === 'POST' && p === '/api/me/password') {
      need(await checkPassword(String(body.current || ''), user.pass), 'كلمة المرور الحالية غير صحيحة');
      need(String(body.next || '').length >= 8, 'كلمة المرور الجديدة لازم تكون 8 أحرف أو أكثر');
      user.pass = await hashPassword(String(body.next)); save(); return { ok: true };
    }
    if (m === 'POST' && p === '/api/poll/vote') {
      need(db.poll.home && db.poll.away, 'ما فيه استطلاع حالياً');
      need(!db.poll.closed, 'الاستطلاع مقفل');
      need(['home', 'draw', 'away'].includes(body.choice) && (body.choice !== 'draw' || db.poll.allowDraw), 'اختيار غير صالح');
      db.poll.votes[user.id] = body.choice; save(); broadcast(); return { ok: true };
    }
    if (m === 'POST' && p === '/api/like') {
      const t = str(body.targetId, 64); need(t, 'العنصر غير موجود');
      const arr = db.likes[t] || (db.likes[t] = []);
      const i = arr.indexOf(user.id);
      if (i >= 0) arr.splice(i, 1); else arr.push(user.id);
      save(); broadcast(); return { ok: true };
    }
    if (m === 'POST' && p === '/api/comments') {
      const c = { id: rid(), targetId: str(body.targetId, 64), userId: user.id, name: user.name, text: str(body.text, 1000), createdAt: now() };
      need(c.targetId && c.text, 'اكتب تعليقك');
      db.comments.push(c); save(); broadcast(); return { ok: true };
    }
    let mm = /^\/api\/comments\/(\w+)$/.exec(p);
    if (m === 'DELETE' && mm) {
      const c = db.comments.find((x) => x.id === mm[1]);
      need(c && (c.userId === user.id || user.isAdmin), 'ما تقدر تحذف هذا التعليق', 403);
      db.comments = db.comments.filter((x) => x !== c); save(); broadcast(); return { ok: true };
    }
    if (m === 'POST' && p === '/api/quiz/answer') {
      need(db.quiz.question, 'ما فيه مسابقة حالياً');
      need(!db.quiz.closed, 'المسابقة انتهت، انتظرونا العدد الجاي');
      need(!db.quiz.answers.some((a) => a.userId === user.id), 'شاركت من قبل، بالتوفيق!');
      const a = { id: rid(), userId: user.id, name: user.name, dept: str(body.dept, 60), answer: str(body.answer, 200), createdAt: now() };
      need(a.answer, 'اكتب إجابتك');
      db.quiz.answers.push(a); save(); broadcast(); return { ok: true };
    }
    if (m === 'POST' && p === '/api/photos') {
      need(/^data:image\/(png|jpeg|webp);base64,/.test(body.image || ''), 'الصورة لازم تكون PNG أو JPG أو WEBP');
      db.photos.push({ id: rid(), userId: user.id, name: user.name, caption: str(body.caption, 200), url: body.image, approved: false, createdAt: now() });
      try { save(); } catch (e) { db.photos.pop(); throw e; }
      broadcast(); return { ok: true };
    }
    if (m === 'POST' && p === '/api/suggestions') {
      const s = { id: rid(), name: body.anonymous ? '' : user.name, type: str(body.type, 40), text: str(body.text, 3000), link: str(body.link, 500), createdAt: now(), done: false };
      need(s.text, 'اكتب مشاركتك أو اقتراحك');
      db.suggestions.push(s); save(); broadcast(); return { ok: true };
    }

    if (p.startsWith('/api/admin/')) {
      need(user.isAdmin, 'هذي الصفحة لفريق النشرة فقط', 403);
      if (m === 'GET' && p === '/api/admin/data') return { suggestions: db.suggestions, quiz: db.quiz, photos: db.photos, poll: db.poll, weather: db.weather };
      mm = /^\/api\/admin\/section\/(\w+)$/.exec(p);
      if (m === 'PUT' && mm) {
        const key = mm[1];
        if (LIST[key]) { need(Array.isArray(body.items), 'بيانات غير صالحة'); db[key] = body.items.slice(0, 50).map((it) => cleanItem(LIST[key], it || {})); }
        else if (key === 'issue') {
          for (const f of ['title', 'greeting', 'dateFrom', 'dateTo', 'quote', 'footer', 'orgName', 'orgNameEn']) db.issue[f] = str(body[f], 1000);
          const site = str(body.siteUrl, 300).replace(/\/+$/, '');
          need(!site || /^https?:\/\/\S+$/.test(site), 'رابط المنصة لازم يبدأ بـ http:// أو https://');
          db.issue.siteUrl = site; db.issue.number = Math.max(1, parseInt(body.number, 10) || 1);
        } else if (key === 'sections') db.sections = normalizeSections(body.sections);
        else if (key === 'weather') {
          const city = str(body.city, 80);
          need(city, 'اكتب اسم المدينة');
          if (city !== db.weather.city) {
            let place = null;
            try {
              const r = await realFetch(`${GEO_API}/v1/search?${new URLSearchParams({ name: city, count: 1, language: 'ar' })}`);
              place = (await r.json()).results?.[0];
            } catch { need(false, 'تعذّر الاتصال بخدمة الطقس، تأكد من الإنترنت'); }
            need(place, 'ما لقينا هالمدينة، جرّب اسم ثاني (بالعربي أو الإنجليزي)');
            Object.assign(db.weather, { city, lat: place.latitude, lon: place.longitude });
          }
          db.weather.enabled = !!body.enabled;
        } else if (key === 'poll') {
          const changed = str(body.home) !== db.poll.home || str(body.away) !== db.poll.away;
          Object.assign(db.poll, { question: str(body.question, 300), home: str(body.home, 80), away: str(body.away, 80), allowDraw: !!body.allowDraw, closed: !!body.closed });
          if (changed || body.reset) { db.poll.votes = {}; db.poll.id = rid(); }
        } else if (key === 'quiz') {
          Object.assign(db.quiz, {
            question: str(body.question, 1000), hint: str(body.hint, 300), prize: str(body.prize, 200), closed: !!body.closed,
            accepted: String(body.accepted || '').split(/[,،\n]/).map((s) => s.trim()).filter(Boolean).slice(0, 20),
          });
          if (body.reset) Object.assign(db.quiz, { id: rid(), answers: [], winner: null, closed: false });
        } else need(false, 'قسم غير معروف');
        save(); broadcast(); return { ok: true };
      }
      if (m === 'POST' && p === '/api/admin/upload') {
        need(/^data:[^;,]*;base64,/.test(body.data || '') && ATTACH_EXT.test(body.name || ''), 'الملف لازم يكون صورة (JPG/PNG/WEBP/GIF) أو مستند (PDF/Word/Excel/PowerPoint)');
        return { url: body.data, name: str(body.name, 120), kind: /\.(png|jpe?g|webp|gif)$/i.test(body.name) ? 'image' : 'file' };
      }
      if (m === 'POST' && p === '/api/admin/layout') {
        const sec = db.sections.find((x) => x.key === body.section);
        need(sec, 'القسم غير موجود');
        if (body.itemId) {
          const item = (db[SECTION_LIST[sec.key]] || []).find((x) => x.id === body.itemId);
          need(item, 'المشاركة غير موجودة');
          need(body.size === '' || SIZES.includes(body.size), 'حجم غير صالح');
          item.size = body.size;
        } else {
          if (body.width !== undefined) { need(WIDTHS.includes(body.width), 'عرض غير صالح'); sec.width = body.width; }
          if (body.size !== undefined) { need(SIZES.includes(body.size), 'حجم غير صالح'); sec.size = body.size; }
        }
        save(); broadcast(); return { ok: true };
      }
      if (m === 'POST' && p === '/api/admin/logo') {
        need(!body.image || /^data:image\/(png|jpeg|webp);base64,/.test(body.image), 'الصورة لازم تكون PNG أو JPG أو WEBP');
        db.issue.logo = body.reset ? DEFAULT_LOGO : body.image || '';
        db.issue.logoRemoved = !db.issue.logo;
        save(); broadcast(); return { logo: db.issue.logo };
      }
      if (m === 'POST' && p === '/api/admin/quiz/draw') {
        const ok = new Set(db.quiz.accepted.map(normalizeArabic));
        const pool = db.quiz.answers.filter((a) => ok.has(normalizeArabic(a.answer)));
        need(pool.length, 'ما فيه إجابات صحيحة للسحب');
        const w = pool[crypto.getRandomValues(new Uint32Array(1))[0] % pool.length];
        db.quiz.winner = { name: w.name, dept: w.dept, correctCount: pool.length, drawnAt: now() }; db.quiz.closed = true;
        save(); broadcast(); return { winner: db.quiz.winner };
      }
      mm = /^\/api\/admin\/photos\/(\w+)\/(approve|feature|delete)$/.exec(p);
      if (m === 'POST' && mm) {
        const ph = db.photos.find((x) => x.id === mm[1]); need(ph, 'الصورة غير موجودة');
        if (mm[2] === 'approve') ph.approved = !ph.approved;
        if (mm[2] === 'feature') { db.featuredPhotoId = db.featuredPhotoId === ph.id ? null : ph.id; ph.approved = true; }
        if (mm[2] === 'delete') { db.photos = db.photos.filter((x) => x !== ph); if (db.featuredPhotoId === ph.id) db.featuredPhotoId = null; }
        save(); broadcast(); return { ok: true };
      }
      mm = /^\/api\/admin\/suggestions\/(\w+)$/.exec(p);
      if (mm && (m === 'POST' || m === 'DELETE')) {
        if (m === 'DELETE') db.suggestions = db.suggestions.filter((s) => s.id !== mm[1]);
        else { const s = db.suggestions.find((x) => x.id === mm[1]); if (s) s.done = !s.done; }
        save(); broadcast(); return { ok: true };
      }
      if (m === 'GET' && p === '/api/admin/users') return { users: db.users.map(publicUser) };
      if (m === 'POST' && p === '/api/admin/users/import') {
        const created = []; const skipped = [];
        for (const line of String(body.text || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean).slice(0, 3000)) {
          const parts = line.split(/[\t,،;]+/).map((x) => x.trim().replace(/^<|>$/g, '')).filter(Boolean);
          const email = parts.find((x) => EMAIL_RE.test(x))?.toLowerCase();
          if (!email) { skipped.push({ line, reason: 'ما فيه إيميل صحيح' }); continue; }
          if (db.users.some((u) => u.email === email)) { skipped.push({ line, reason: 'الحساب موجود من قبل' }); continue; }
          const name = str(parts.filter((x) => x.toLowerCase() !== email).join(' '), 80) || nameFromEmail(email);
          const password = makePassword();
          const u = { id: rid(), name, email, username: makeUsername(email), pass: await hashPassword(password), isAdmin: false, createdAt: now() };
          db.users.push(u); created.push({ name, email, username: u.username, password });
        }
        save(); return { created, skipped };
      }
      mm = /^\/api\/admin\/users\/(\w+)(\/reset)?$/.exec(p);
      if (mm) {
        const t = db.users.find((u) => u.id === mm[1]); need(t, 'الحساب غير موجود', 404);
        if (m === 'POST' && mm[2]) {
          const password = makePassword();
          t.pass = await hashPassword(password); save();
          return { name: t.name, email: t.email, username: t.username, password };
        }
        if (m === 'PUT') {
          need(str(body.name, 80), 'اكتب اسم صاحب الحساب');
          need(body.isAdmin || !t.isAdmin || db.users.filter((u) => u.isAdmin).length > 1, 'لازم يبقى مدير واحد على الأقل');
          t.name = str(body.name, 80); t.isAdmin = !!body.isAdmin; save(); broadcast(); return { ok: true };
        }
        if (m === 'DELETE') {
          need(t.id !== user.id, 'ما تقدر تحذف حسابك وأنت داخل فيه');
          need(!t.isAdmin || db.users.filter((u) => u.isAdmin).length > 1, 'لازم يبقى مدير واحد على الأقل');
          db.users = db.users.filter((u) => u !== t); save(); return { ok: true };
        }
      }
    }
    throw err(404, 'غير موجود');
  }

  // ---------- وضع التشغيل ----------
  // إذا الملف مفتوح من خادم المنصة (server.js) نستخدم بياناته المشتركة،
  // وإذا مفتوح كملف من الجهاز أو من استضافة عادية نشتغل محلياً في المتصفح.
  let MODE = null;
  let modeCheck = null;
  function detectMode() {
    if (!modeCheck) {
      modeCheck = (async () => {
        if (location.protocol === 'http:' || location.protocol === 'https:') {
          try {
            const r = await realFetch('/api/brand', { cache: 'no-store' });
            if (r.ok && r.headers.get('X-Weekend-Saeed')) return 'server';
          } catch { /* ما فيه خادم */ }
        }
        return 'local';
      })().then((m) => { MODE = m; document.documentElement.dataset.mode = m; return m; });
    }
    return modeCheck;
  }

  // نعترض طلبات /api/ ونجاوبها من هنا (أو نمررها للخادم)، وباقي الطلبات مثل الطقس تروح للإنترنت عادي
  const realFetch = window.fetch.bind(window);
  window.fetch = async (input, init = {}) => {
    const url = new URL(typeof input === 'string' ? input : input.url, location.href);
    const i = url.pathname.indexOf('/api/');
    if (i < 0 || url.origin !== location.origin) return realFetch(input, init);
    if ((await detectMode()) === 'server') return realFetch(input, init);
    let status = 200; let data;
    try { data = await route((init.method || 'GET').toUpperCase(), url.pathname.slice(i), init.body ? JSON.parse(init.body) : {}); }
    catch (e) { status = e.status || 500; data = { error: e.status ? e.message : 'صار خطأ، جرّب مرة ثانية' }; if (!e.status) console.error(e); }
    return new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } });
  };
})();

</script>

<script>
// أدوات مشتركة بين صفحة الموظفين ولوحة الإدارة
'use strict';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* تجاهل */ } },
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function safeUrl(u) {
  if (!String(u ?? '').trim()) return '';
  try { const x = new URL(u, location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

async function api(path, { method = 'GET', body, headers = {} } = {}) {
  const res = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', ...headers },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  // انتهت الجلسة أو ما سجّل دخول: نوديه لصفحة الدخول ونرجعه لنفس المكان بعدها
  if (res.status === 401 && !location.hash.startsWith('#/login')) {
    go('login');
    return new Promise(() => {});
  }
  if (!res.ok) throw new Error(data.error || 'صار خطأ، جرّب مرة ثانية');
  return data;
}

let toastTimer;
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('bad', !!bad);
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3000);
}

function timeAgo(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'الحين';
  if (s < 3600) return `قبل ${Math.floor(s / 60)} دقيقة`;
  if (s < 86400) return `قبل ${Math.floor(s / 3600)} ساعة`;
  return `قبل ${Math.floor(s / 86400)} يوم`;
}

// أرقام عربية (٠١٢٣) مثل هوية الجهة
const arNum = (n) => String(n).replace(/\d/g, (x) => '٠١٢٣٤٥٦٧٨٩'[x]);

function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d + 'T00:00:00').toLocaleDateString('ar-SA-u-ca-gregory', { day: 'numeric', month: 'long' }); } catch { return d; }
}

const LABELS = {
  rec: { restaurant: ['🍽️', 'مطعم'], cafe: ['☕', 'كافيه'], movie: ['🎬', 'فيلم'], book: ['📚', 'كتاب'], series: ['📺', 'مسلسل'], place: ['🏝️', 'مكان'], other: ['✨', 'توصية'] },
  creative: { article: ['📝', 'مقالة'], podcast: ['🎙️', 'بودكاست'], poem: ['🪶', 'قصيدة'], other: ['🎨', 'مشاركة'] },
  occasion: { welcome: ['👋', 'أهلاً وسهلاً'], congrats: ['🎉', 'مبروك'], birthday: ['🎂', 'عيد ميلاد سعيد'], promotion: ['🚀', 'ترقية'], baby: ['🍼', 'مولود جديد'], farewell: ['🤍', 'وداعاً'] },
};
const label = (group, key) => LABELS[group][key] || LABELS[group].other || ['✨', key];

// رموز حالة الطقس (WMO) من Open-Meteo
function weatherInfo(code) {
  if (code === 0) return ['☀️', 'صحو'];
  if (code <= 2) return ['🌤️', 'غائم جزئياً'];
  if (code === 3) return ['☁️', 'غائم'];
  if (code <= 48) return ['🌫️', 'ضباب'];
  if (code <= 57) return ['🌦️', 'رذاذ'];
  if (code <= 67) return ['🌧️', 'مطر'];
  if (code <= 77) return ['❄️', 'ثلج'];
  if (code <= 82) return ['🌦️', 'زخات مطر'];
  if (code <= 86) return ['🌨️', 'زخات ثلج'];
  return ['⛈️', 'عواصف رعدية'];
}

async function logout() {
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  go('login');
}

// الرابط الأساسي للملف (يُستخدم في QR والإيميلات إذا ما انحط رابط المنصة)
const SITE_BASE = location.protocol === 'file:' ? location.href.split('#')[0] : location.origin;

</script>

<script>
'use strict';
const VIEW_TITLES = { home: 'ويكند سعيد', admin: 'إدارة ويكند سعيد', login: 'دخول — ويكند سعيد' };
function currentView() {
  if (location.hash.startsWith('#/admin')) return 'admin';
  if (location.hash.startsWith('#/login')) return 'login';
  return 'home';
}
function go(view) { location.hash = view === 'home' ? '#/' : '#/' + view; }
const ACTIVE_VIEW = currentView();
// الانتقال بين الصفحات يعيد تحميل الملف عشان تبدأ كل صفحة نظيفة (روابط الأقسام مثل #quiz ما تتأثر)
window.addEventListener('hashchange', () => { if (currentView() !== ACTIVE_VIEW) location.reload(); });
document.body.className = { home: 'loading', admin: '', login: 'login-page' }[ACTIVE_VIEW];
document.title = VIEW_TITLES[ACTIVE_VIEW];
document.getElementById('app').replaceChildren(document.getElementById('tpl-' + ACTIVE_VIEW).content.cloneNode(true));

// نسخة احتياطية: البيانات محلية، فنخلي المدير يحفظها ويرجعها أو ينقلها لجهاز ثاني
function backupTools() {
  const KEY = 'weekend-saeed-data-v1';
  const box = document.createElement('div');
  box.className = 'wrap local-only';
  box.innerHTML = '<div class="card" style="margin:18px 0"><h3>💾 النسخ الاحتياطي</h3>' +
    '<p class="muted small">البيانات في نسخة الملف الواحد محفوظة في هذا المتصفح فقط. نزّل نسخة احتياطية بشكل دوري، وتقدر ترجعها هنا أو على جهاز ثاني.</p>' +
    '<div class="actions"><button type="button" class="btn sm" id="bk-save">⬇️ تنزيل نسخة احتياطية</button>' +
    '<label class="btn ghost sm">⬆️ استرجاع نسخة<input type="file" id="bk-load" accept="application/json,.json" hidden></label></div></div>';
  document.getElementById('panel').appendChild(box);
  document.getElementById('bk-save').onclick = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([localStorage.getItem(KEY) || '{}'], { type: 'application/json' }));
    a.download = 'weekend-saeed-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById('bk-load').onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      if (!Array.isArray(data.users) || !data.users.some((u) => u.isAdmin) || !Array.isArray(data.sections)) throw new Error();
      if (!confirm('استرجاع النسخة بيستبدل كل البيانات الحالية في هذا المتصفح. نكمّل؟')) return;
      localStorage.setItem(KEY, JSON.stringify(data));
      location.reload();
    } catch { toast('الملف مو نسخة احتياطية صحيحة من ويكند سعيد', true); }
  };
}
</script>
<!-- الصفحات -->
<script>
function initHome() {
// ويكند سعيد — صفحة الموظفين
'use strict';

let state = null;
const openComments = new Set();
const drafts = {};
const $ = (s, el = document) => el.querySelector(s);


// حجم المشاركة: من إعداد المشاركة نفسها، وإذا فاضي ياخذ حجم القسم
const SIZES = ['sm', 'md', 'lg', 'full'];
const sz = (it) => (SIZES.includes(it.size) ? `sz-${it.size}` : '');
const WIDTHS = ['quarter', 'third', 'half', 'full'];
const ADMIN_TAB = { matches: 'matches', poll: 'poll', recs: 'recommendations', lens: 'lens', creative: 'creative', selfdev: 'selfdev', occasions: 'occasions', quiz: 'quiz', box: 'box' };

// المرفقات الاختيارية: صورة و/أو مستند، وما يظهر شي إذا ما فيه مرفق
const FILE_ICONS = { pdf: '📕', doc: '📘', docx: '📘', xls: '📗', xlsx: '📗', ppt: '📙', pptx: '📙' };
function attachments(x) {
  const img = safeUrl(x.image);
  const file = safeUrl(x.fileUrl);
  if (!img && !file) return '';
  const ext = (String(x.fileName || x.fileUrl).toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || '';
  return `<div class="att">
    ${img ? `<a href="${esc(img)}" target="_blank" rel="noopener" class="att-img"><img src="${esc(img)}" alt="" loading="lazy"></a>` : ''}
    ${file ? `<a href="${esc(file)}" download="${esc(x.fileName || '')}" target="_blank" rel="noopener" class="att-file">${FILE_ICONS[ext] || '📄'} ${esc(x.fileName || 'مرفق')}<small>${esc(ext.toUpperCase())} · تحميل</small></a>` : ''}
  </div>`;
}

// ---------- تنسيق الصفحة (للإدارة فقط): أحجام المشاركات وعرض الأقسام مباشرة من الصفحة ----------
let layoutMode = store.get('wk-layout') === '1';
const SIZE_NAMES = { sm: 'صغير', md: 'متوسط', lg: 'كبير', full: 'كامل' };
const WIDTH_NAMES = { quarter: 'ربع', third: 'ثلث', half: 'نص', full: 'كامل' };
function sizeTools(sec, item) {
  if (!layoutMode || !state.me.isAdmin) return '';
  const current = SIZES.includes(item.size) ? item.size : '';
  return `<div class="lay-tools" title="حجم هذي المشاركة">📐
    ${SIZES.map((k) => `<button type="button" class="${current === k ? 'on' : ''}" data-act="lay" data-sec="${sec}" data-id="${esc(item.id)}" data-size="${k}">${SIZE_NAMES[k]}</button>`).join('')}
    <button type="button" class="${current ? '' : 'on'}" data-act="lay" data-sec="${sec}" data-id="${esc(item.id)}" data-size="" title="ياخذ حجم القسم">تلقائي</button>
  </div>`;
}
function sectionTools(s) {
  const list = ['matches', 'recs', 'creative', 'selfdev', 'occasions', 'lens'].includes(s.key);
  return `<div class="lay-tools sec-tools">
    <span>↔️ عرض القسم:</span>
    ${WIDTHS.map((k) => `<button type="button" class="${s.width === k ? 'on' : ''}" data-act="lay" data-sec="${s.key}" data-width="${k}">${WIDTH_NAMES[k]}</button>`).join('')}
    ${list ? `<span>· 📐 حجم المشاركات:</span>
    ${SIZES.map((k) => `<button type="button" class="${s.size === k ? 'on' : ''}" data-act="lay" data-sec="${s.key}" data-size="${k}">${SIZE_NAMES[k]}</button>`).join('')}` : ''}
  </div>`;
}

// ---------- التفاعل: إعجاب + تعليقات ----------

function interact(targetId) {
  const lk = state.likes[targetId] || { count: 0, mine: false };
  const cs = state.comments.filter((c) => c.targetId === targetId);
  const open = openComments.has(targetId);
  return `
  <div class="interact" data-target="${esc(targetId)}">
    <div class="interact-bar">
      <button class="pill like ${lk.mine ? 'on' : ''}" data-act="like" aria-pressed="${lk.mine}">${lk.mine ? '❤️' : '🤍'} ${lk.count || ''} عجبني</button>
      <button class="pill" data-act="toggle-comments" aria-expanded="${open}">💬 ${cs.length || ''} تعليق</button>
    </div>
    ${open ? `
    <div class="comments">
      ${cs.map((c) => `<div class="comment"><b>${esc(c.name)}</b> <span class="muted">${timeAgo(c.createdAt)}</span>
        ${c.mine || state.me.isAdmin ? `<button class="link-btn small" data-act="del-comment" data-id="${esc(c.id)}">حذف</button>` : ''}<p>${esc(c.text)}</p></div>`).join('') || '<p class="muted small">كن أول من يعلّق 👀</p>'}
      <form class="comment-form" data-act="comment">
        <input name="text" placeholder="اكتب تعليقك…" maxlength="1000" required value="${esc(drafts[targetId] || '')}" data-draft="${esc(targetId)}">
        <button class="btn sm">نشر</button>
      </form>
    </div>` : ''}
  </div>`;
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn || btn.tagName === 'FORM') return;
  const target = btn.closest('[data-target]')?.dataset.target;
  const act = btn.dataset.act;
  try {
    if (act === 'like') { await api('/api/like', { method: 'POST', body: { targetId: target } }); await refresh(); }
    if (act === 'toggle-comments') {
      openComments.has(target) ? openComments.delete(target) : openComments.add(target);
      render();
      if (openComments.has(target)) $(`[data-draft="${CSS.escape(target)}"]`)?.focus();
    }
    if (act === 'vote') { await api('/api/poll/vote', { method: 'POST', body: { choice: btn.dataset.choice } }); toast('تم تسجيل توقعك 👌'); await refresh(); }
    if (act === 'lay') {
      const d = btn.dataset;
      const body = { section: d.sec };
      if (d.id) Object.assign(body, { itemId: d.id, size: d.size });
      else if (d.width) body.width = d.width;
      else body.size = d.size;
      await api('/api/admin/layout', { method: 'POST', body });
      await refresh();
    }
    if (act === 'expand') { btn.closest('.creative-item').classList.toggle('expanded'); }
    if (act === 'del-comment' && confirm('تحذف التعليق؟')) { await api(`/api/comments/${btn.dataset.id}`, { method: 'DELETE' }); await refresh(); }
  } catch (err) { toast(err.message, true); }
});

document.addEventListener('input', (e) => {
  if (e.target.dataset.draft) drafts[e.target.dataset.draft] = e.target.value;
});

document.addEventListener('submit', async (e) => {
  const f = e.target;
  if (f.dataset.act !== 'comment') return;
  e.preventDefault();
  const targetId = f.closest('[data-target]').dataset.target;
  const fd = new FormData(f);
  try {
    await api('/api/comments', { method: 'POST', body: { targetId, text: fd.get('text') } });
    delete drafts[targetId];
    await refresh();
  } catch (err) { toast(err.message, true); }
});

// ---------- الأقسام ----------

function renderIssue() {
  const i = state.issue;
  document.title = i.title || 'ويكند سعيد';
  $('#issue-title').textContent = i.title || 'ويكند سعيد';
  $('#issue-no').textContent = arNum(i.number);
  $('#issue-greeting').textContent = i.greeting;
  const d = [fmtDate(i.dateFrom), fmtDate(i.dateTo)].filter(Boolean).join(' – ');
  $('#issue-dates').textContent = d ? ` · ${d}` : '';
  renderBrand(i);
  $('#issue-quote').textContent = i.quote ? `“${i.quote}”` : '';
  $('#issue-footer').textContent = i.footer || '';
  $('#hello').textContent = `هلا ${state.me.name} 👋`;
  $('#admin-link').hidden = !state.me.isAdmin;
  const lt = $('#layout-toggle');
  lt.hidden = !state.me.isAdmin;
  lt.textContent = layoutMode ? '✅ إنهاء التنسيق' : '📐 تنسيق الصفحة';
  document.body.classList.toggle('layout-mode', layoutMode && state.me.isAdmin);
}

// عناوين الأقسام وترتيبها وإظهارها من إعدادات الإدارة
function renderSections() {
  const main = $('main');
  const nav = [];
  for (const s of state.sections) {
    const el = document.getElementById(s.key);
    if (!el) continue;
    main.appendChild(el);
    el.dataset.acc = String(state.sections.indexOf(s) % 6);
    el.dataset.size = SIZES.includes(s.size) ? s.size : 'md';
    el.dataset.width = WIDTHS.includes(s.width) ? s.width : 'full';
    // مرفق القسم وأدوات التنسيق تحت العنوان
    let extra = $('.sec-extra', el);
    if (!extra) { extra = document.createElement('div'); extra.className = 'sec-extra'; $('.sec-head', el).after(extra); }
    extra.innerHTML = (layoutMode && state.me.isAdmin ? sectionTools(s) : '') + attachments(s);
    const empty = s.key === 'occasions' && !state.occasions.length;
    el.hidden = !s.visible || empty;
    $('.sec-head h2', el).textContent = [s.emoji, s.title].filter(Boolean).join(' ');
    $('.sec-head p', el).textContent = s.subtitle;
    // زر تعديل سريع للإدارة: يفتح لوحة الإدارة على محتوى هذا القسم
    if (state.me.isAdmin && !$('.edit-sec', el)) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'edit-sec'; b.textContent = '✏️ تعديل';
      b.onclick = () => { store.set('wk-admin-tab', ADMIN_TAB[s.key]); location.href = $('#admin-link').getAttribute('href'); };
      $('.sec-head', el).appendChild(b);
    }
    if (!el.hidden) nav.push(`<a href="#${s.key}">${esc([s.emoji, s.nav].filter(Boolean).join(' '))}</a>`);
  }
  $('#nav').innerHTML = nav.join('');
}

function renderOccasions() {
  const list = state.occasions;
  $('#occasions-list').innerHTML = list.map((o) => {
    const [ic, t] = label('occasion', o.type);
    return `<div class="occasion ${sz(o)}">${sizeTools('occasions', o)}<div class="oc-row"><span class="oc-ic">${ic}</span><div><b>${esc(t)} ${esc(o.person)}</b><p>${esc(o.text)}</p></div></div>${attachments(o)}</div>`;
  }).join('');
}

function renderMatches() {
  $('#matches-list').innerHTML = state.matches.map((m) => `
    <article class="card match ${sz(m)}">${sizeTools('matches', m)}
      <div class="match-top"><span class="league">${esc(m.league)}</span><span class="day">${esc(m.day)} · ${esc(m.time)}</span></div>
      <div class="teams"><span>${esc(m.home)}</span><span class="vs">VS</span><span>${esc(m.away)}</span></div>
      <div class="match-meta">${m.stadium ? `🏟️ ${esc(m.stadium)}` : ''} ${m.channel ? `<span>📺 ${esc(m.channel)}</span>` : ''}</div>
      ${attachments(m)}
      ${interact(m.id)}
    </article>`).join('') || '<p class="card empty">⚽ مباريات الويكند تنزل قريب… جهّز القهوة!</p>';
}

function renderPoll() {
  const p = state.poll;
  if (!p.home || !p.away) { $('#poll-box').innerHTML = '<p class="empty" style="padding:24px 8px">🔮 استطلاع التوقعات ينزل مع مباريات الويكند… خلّك جاهز!</p>'; return; }
  const c = p.counts;
  const total = c.home + c.away + c.draw;
  const voted = !!p.myVote;
  const showResults = voted || p.closed;
  const opts = [['home', p.home], ...(p.allowDraw ? [['draw', 'تعادل 🤝']] : []), ['away', p.away]];
  $('#poll-box').innerHTML = `
    <h3>${esc(p.question)}</h3>
    <div class="poll-opts">
      ${opts.map(([k, name]) => {
        const pct = total ? Math.round((c[k] / total) * 100) : 0;
        return `<button class="poll-opt ${p.myVote === k ? 'mine' : ''}" data-act="vote" data-choice="${k}" ${p.closed ? 'disabled' : ''}>
          <span class="bar" style="width:${showResults ? pct : 0}%"></span>
          <span class="opt-name">${esc(name)} ${p.myVote === k ? '✓' : ''}</span>
          ${showResults ? `<span class="opt-pct">${pct}% <small>(${c[k]})</small></span>` : ''}
        </button>`;
      }).join('')}
    </div>
    <p class="muted small">${p.closed ? '🔒 التصويت انتهى' : voted ? 'تقدر تغيّر رأيك قبل ما يقفل التصويت' : 'اضغط على توقعك عشان تشوف النتيجة'} · ${total} مشارك</p>
    ${interact(p.id)}`;
}

function qr(el, text) {
  try {
    const q = qrcode(0, 'M');
    q.addData(text);
    q.make();
    el.innerHTML = q.createSvgTag(3, 2);
  } catch { el.remove(); }
}

function renderRecs() {
  $('#recs-list').innerHTML = state.recommendations.map((r) => {
    const [ic, cat] = label('rec', r.category);
    const link = safeUrl(r.link);
    const isBook = r.category === 'book';
    return `
    <article class="card rec cat-${esc(r.category)} ${sz(r)}">${sizeTools('recs', r)}
      <div class="rec-head"><span class="rec-ic">${ic}</span><div>
        <span class="tag">${esc(cat)}</span>
        <h3>${esc(r.title || cat)} ${isBook ? 'ينصح فيه' : 'برأي'} زميلنا <span class="who">${esc(r.colleague)}</span></h3>
      </div></div>
      <h4>${esc(r.itemName)}</h4>
      <p>${esc(r.description)}</p>
      ${r.location ? `<p class="muted small">📍 ${esc(r.location)}</p>` : ''}
      ${link ? `<div class="rec-link">
        <a class="btn sm" href="${esc(link)}" target="_blank" rel="noopener">${isBook ? '📥 تحميل / قراءة الكتاب' : '🔗 الرابط'}</a>
        ${isBook ? `<div class="qr" data-qr="${esc(link)}" title="امسح الكود من جوالك"></div>` : ''}</div>` : ''}
      ${attachments(r)}
      ${interact(r.id)}
    </article>`;
  }).join('') || '<p class="card empty">💡 ما فيه توصيات للحين، كن أول من يشاركنا وحدة من الصندوق تحت 👇</p>';
  document.querySelectorAll('#recs-list [data-qr]').forEach((el) => qr(el, el.dataset.qr));
}

function renderLens() {
  const f = state.photos.find((p) => p.id === state.featuredPhotoId);
  $('#lens-featured').innerHTML = f ? `
    <figure class="card featured">
      <img src="${esc(f.url)}" alt="${esc(f.caption || 'صورة الويكند')}" loading="lazy">
      <figcaption><span class="tag gold">🏆 صورة العدد</span> <b>بعدسة ${esc(f.name)}</b>${f.caption ? ` — ${esc(f.caption)}` : ''}</figcaption>
      ${interact(f.id)}
    </figure>` : '<div class="card empty">📷 صورة العدد تنزل هنا… يمكن تكون صورتك!</div>';
  const others = state.photos.filter((p) => p.id !== state.featuredPhotoId);

function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file) return reject(new Error('اختر صورة'));
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      // تصغير الصورة قبل الرفع عشان تكون خفيفة
      const max = 1600;
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('ما قدرنا نقرأ الصورة')); };
    img.src = url;
  });
}

function renderCountdown() {
  const el = $('#countdown');
  const d = new Date();
  const day = d.getDay(); // 5 = الجمعة، 6 = السبت
  const card = (num, label, sub) => `<b class="stat-num">${num}</b><span class="stat-label">${label}</span><small>${sub}</small>`;
  if (day === 5 || day === 6) { el.innerHTML = card('🌴', 'الويكند بدأ!', 'استمتع وارتاح، وشوفنا الأحد بطاقة'); return; }
  const end = new Date(d);
  end.setDate(d.getDate() + ((4 - day + 7) % 7));
  end.setHours(16, 0, 0, 0); // الخميس الساعة 4 العصر
  if (end <= d) { el.innerHTML = card('🎉', 'خلص الدوام!', 'ويكند سعيد'); return; }
  const ms = end - d;
  const dd = Math.floor(ms / 864e5), hh = Math.floor((ms % 864e5) / 36e5), mm = Math.floor((ms % 36e5) / 6e4);
  el.innerHTML = dd
    ? card(arNum(dd), dd === 1 ? 'يوم على الويكند' : 'أيام على الويكند', `و ${arNum(hh)} ساعة · نهاية الدوام الخميس`)
    : card(`${arNum(hh)}:${arNum(String(mm).padStart(2, '0'))}`, 'ساعة على الويكند', 'نهاية الدوام الخميس ٤ العصر');
}

async function loadWeather() {
  const cards = ['#weather', '#w-fri', '#w-sat'].map((x) => $(x));
  const hide = () => cards.forEach((c) => { c.hidden = true; });
  if (!state.weatherCity) return hide();
  try {
    const { weather: w } = await api('/api/weather');
    if (!w) return hide();
    const [ic, txt] = weatherInfo(w.current.code);
    cards[0].innerHTML = `<b class="stat-num">${arNum(w.current.temp)}°</b><span class="stat-label">${ic} ${esc(w.city)} الآن · ${txt}</span>
      <small>المحسوسة ${arNum(w.current.feels)}° · رطوبة ${arNum(w.current.humidity)}٪ · رياح ${arNum(w.current.wind)} كم/س</small>`;
    // توقعات الجمعة والسبت الجايين
    for (const [n, card] of [[5, cards[1]], [6, cards[2]]]) {
      const day = w.days.find((x) => new Date(x.date + 'T12:00:00').getDay() === n);
      card.hidden = !day;
      if (!day) continue;
      const [dic, dtxt] = weatherInfo(day.code);
      card.innerHTML = `<b class="stat-num">${arNum(day.max)}°</b><span class="stat-label">${dic} ${n === 5 ? 'الجمعة' : 'السبت'} · ${dtxt}</span>
        <small>الصغرى ${arNum(day.min)}° · العظمى ${arNum(day.max)}°</small>`;
    }
    cards[0].hidden = false;
  } catch { hide(); }
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('ما قدرنا نقرأ الملف'));
    r.readAsDataURL(file);
  });
}

// الصور الكبيرة نصغّرها قبل الرفع (ما عدا GIF عشان ما تخرب الحركة)
async function shrinkImage(file) {
  if (file.type === 'image/gif') return { data: await fileToDataUrl(file), name: file.name };
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('ما قدرنا نقرأ الصورة')); i.src = url; });
    const k = Math.min(1, 1800 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return { data: c.toDataURL('image/jpeg', 0.85), name: file.name.replace(/\.[^.]+$/, '') + '.jpg' };
  } finally { URL.revokeObjectURL(url); }
}
