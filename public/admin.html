<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة ويكند سعيد</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
</head>
<body>
  <div class="wrap">
    <form id="login" class="card form login" hidden>
      <h2>🛠️ لوحة فريق النشرة</h2>
      <label>كلمة المرور<input name="password" type="password" required autofocus></label>
      <button class="btn">دخول</button>
      <p class="form-msg" role="status"></p>
    </form>

    <div id="panel" hidden>
      <div class="admin-bar">
        <h2>🛠️ إدارة ويكند سعيد</h2>
        <div class="actions">
          <a class="btn ghost sm" href="/" target="_blank">👀 عرض الصفحة</a>
          <button class="btn ghost sm" id="logout">خروج</button>
        </div>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="card" id="tab-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
