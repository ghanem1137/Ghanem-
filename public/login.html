<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دخول — ويكند سعيد</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
</head>
<body class="login-page">
  <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <main>
  <form id="login" class="card form login">
    <div class="login-head">
      <img id="org-logo" alt="" hidden>
      <span class="org" id="org-name"></span>
      <h1 id="site-title">ويكند سعيد ☀️</h1>
      <p class="muted">هلا فيك! ادخل بحسابك عشان تتفاعل مع الزملاء</p>
    </div>
    <label>اسم المستخدم أو الإيميل<input name="username" autocomplete="username" required autofocus dir="ltr"></label>
    <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn">دخول</button>
    <p class="form-msg bad" role="alert"></p>
    <button type="button" class="link-btn forgot-link" id="forgot-open">نسيت كلمة المرور؟</button>
    <p class="muted small">ما عندك حساب؟ تواصل مع فريق النشرة.</p>
  </form>

  <form id="forgot" class="card form login" hidden>
    <div class="login-head">
      <h1>🔑 نسيت كلمة المرور؟</h1>
      <p class="muted">اكتب اسم المستخدم أو إيميلك، ويوصل طلبك لمدير النظام، وبتوصلك كلمة مرور جديدة على إيميلك في أوتلوك.</p>
    </div>
    <label>اسم المستخدم أو الإيميل<input name="login" autocomplete="username" required dir="ltr"></label>
    <button class="btn">أرسل الطلب</button>
    <p class="form-msg" role="status"></p>
    <button type="button" class="link-btn forgot-link" id="forgot-back">← الرجوع للدخول</button>
  </form>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/common.js"></script>
  <script>
    'use strict';
    const f = document.getElementById('login');
    // هوية الجهة (الاسم والشعار)
    api('/api/brand').then((b) => {
      document.getElementById('org-name').textContent = b.orgName || '';
      document.getElementById('site-title').textContent = `${b.title || 'ويكند سعيد'} ☀️`;
      const img = document.getElementById('org-logo');
      if (b.logo) { img.src = b.logo; img.alt = b.orgName || ''; img.hidden = false; document.getElementById('org-name').hidden = true; }
    }).catch(() => {});
    // نسيت كلمة المرور
    const fg = document.getElementById('forgot');
    const swapForms = (showForgot) => {
      f.hidden = showForgot; fg.hidden = !showForgot;
      (showForgot ? fg.login : f.username).focus();
    };
    document.getElementById('forgot-open').onclick = () => { fg.login.value = f.username.value; swapForms(true); };
    document.getElementById('forgot-back').onclick = () => swapForms(false);
    fg.addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = fg.querySelector('.form-msg');
      const btn = fg.querySelector('.btn');
      btn.disabled = true;
      try {
        await api('/api/forgot', { method: 'POST', body: { login: fg.login.value } });
        msg.classList.remove('bad');
        msg.textContent = '✅ إذا كان الحساب موجود، وصل طلبك لمدير النظام وبتوصلك كلمة مرور جديدة على إيميلك.';
      } catch (err) { msg.classList.add('bad'); msg.textContent = err.message; btn.disabled = false; }
    });

    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = f.querySelector('button');
      btn.disabled = true;
      try {
        await api('/api/login', { method: 'POST', body: { username: f.username.value, password: f.password.value } });
        // نرجعه للصفحة اللي كان فيها (داخل الموقع فقط)
        const next = new URLSearchParams(location.search).get('next') || '/';
        location.href = /^\/(?!\/)/.test(next) ? next : '/';
      } catch (err) {
        f.querySelector('.form-msg').textContent = err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
